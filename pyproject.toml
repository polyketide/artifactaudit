[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artifactaudit"
version = "0.1.0"
description = "Deterministic guardrails for AI-assisted research: artifact-integrity audits and host confinement for unpublished data"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["research-integrity", "reproducibility", "llm-agents", "provenance", "data-governance"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = []   # the core is pure stdlib on purpose

[project.optional-dependencies]
# Only the document-extraction path needs anything beyond the standard library.
documents = ["pypdf>=4.0", "openpyxl>=3.1"] # ingest text extraction from .pdf / .xlsx
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["artifactaudit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
